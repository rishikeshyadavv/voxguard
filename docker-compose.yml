version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voxguard-backend
    ports:
      - "8000:8000"
    environment:
      - MODEL_BACKEND=stub
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voxguard-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
